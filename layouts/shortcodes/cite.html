{{- $key := .Get 0 -}}
{{- $pub := index (where hugo.Data.publications "key" $key) 0 -}}
{{- if $pub -}}
  {{- $label := $pub.abbr | default $pub.year -}}
  {{- $tooltip := printf "%s — %s (%d)" $pub.title (delimit $pub.authors ", ") $pub.year -}}
  <a href="/publications/" title="{{ $tooltip }}"
     class="inline-flex items-center text-xs font-semibold px-1.5 py-0.5 rounded
            bg-primary-100 dark:bg-primary-900 text-primary-700 dark:text-primary-300
            no-underline hover:underline align-middle">{{ $label }}</a>
{{- else -}}
  <span class="text-xs text-red-500">[{{ $key }}?]</span>
{{- end -}}
